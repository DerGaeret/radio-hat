# Retro-Radio: /etc/asound.conf fuer den Raspberry Pi DigiAMP+
# Alle Programme spielen ueber einen Hochpass (Butterworth 2. Ordnung, 50 Hz) auf den DigiAMP+.
# Die kleinen Lautsprecher in den 3-l-Kammern strahlen tiefer kaum ab; der Hochpass spart
# Hub und Leistung. Braucht: sudo apt install libasound2-plugins swh-plugins
# Karte 0 ist der DigiAMP+, wenn in config.txt "dtparam=audio=off" und "vc4-kms-v3d,noaudio" stehen.
# Ungetestet am Geraet. Ohne Hochpass: diese Datei weglassen.
pcm.!default {
    type plug
    slave.pcm "hochpass"
}
pcm.hochpass {
    type ladspa
    slave.pcm "plughw:0,0"
    path "/usr/lib/ladspa"
    plugins [
        {
            label butthigh_iir          # swh-plugins, butterworth_1902.so
            input {
                controls [ 50 1.41 ]    # Grenzfrequenz in Hz, Resonanz (Bereich 0,1-1,41; 1,41 = Daempfung 1/Q fuer Butterworth, nicht am Geraet geprueft)
            }
        }
    ]
}
ctl.!default {
    type hw
    card 0
}
