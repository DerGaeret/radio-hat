# Radio HAT: /etc/asound.conf
# Alle Programme spielen ueber die I2S-Karte, immer mit 32 Bit je Kanal. Damit laeuft der Bittakt
# unabhaengig vom Format der Musik mit 64 fs und passt zur Voreinstellung des TAS5805M (I2S, 24-Bit-Woerter,
# Register 0x33). Die Abtastrate bleibt unveraendert (32 bis 96 kHz sind erlaubt).
pcm.!default {
    type plug
    slave {
        pcm "hw:CARD=sndrpihifiberry,DEV=0"
        format S32_LE
    }
}
ctl.!default {
    type hw
    card sndrpihifiberry
}
